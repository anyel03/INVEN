{% extends 'base.html' %}

{% block title %}Rutas{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom border-secondary">
    <h1><i class="bi bi-geo-alt me-2"></i>Rutas</h1>
    <a href="{% url 'ruta_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-2"></i>Nueva Ruta
    </a>
</div>

<div class="card bg-dark border-secondary">
    <div class="card-body p-0">
        <table class="table table-dark table-hover mb-0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for ruta in rutas %}
                <tr>
                    <td>{{ ruta.id }}</td>
                    <td><span class="badge bg-primary">{{ ruta.nombre }}</span></td>
                    <td>{{ ruta.descripcion|default:'-' }}</td>
                    <td>
                        <a href="{% url 'ruta_edit' ruta.id %}" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a href="{% url 'ruta_delete' ruta.id %}" class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-center text-muted">No hay rutas</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
