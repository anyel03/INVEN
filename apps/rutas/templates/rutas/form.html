{% extends 'base.html' %}

{% block title %}Nueva Ruta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card bg-dark border-primary">
            <div class="card-header">
                <h4 class="mb-0">
                    <i class="bi bi-geo-alt me-2"></i>Nueva Ruta
                </h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <!-- Nombre de la Ruta -->
                    <div class="mb-3">
                        <label for="id_nombre" class="form-label">Nombre de la Ruta</label>
                        <input type="text" 
                               name="nombre" 
                               id="id_nombre" 
                               class="form-control bg-dark text-white border-secondary" 
                               placeholder="Ej. Ruta Norte, Zona Centro..." 
                               maxlength="100" 
                               required>
                    </div>
                    
                    <!-- Descripción de la Ruta -->
                    <div class="mb-4">
                        <label for="id_descripcion" class="form-label">Descripción</label>
                        <textarea name="descripcion" 
                                  id="id_descripcion" 
                                  class="form-control bg-dark text-white border-secondary" 
                                  rows="4" 
                                  placeholder="Detalles sobre las zonas, clientes o itinerario que cubre esta ruta..." 
                                  required></textarea>
                    </div>
                    
                    <!-- Botones de Acción -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-2"></i>Crear Ruta
                        </button>
                        <a href="/rutas/" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-2"></i>Volver al Listado
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
