{% extends 'base.html' %}

{% block title %}{{ action|title }} Usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark border-primary">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-person me-2"></i>{{ action|title }} Usuario</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control bg-dark text-white border-secondary" 
                               value="{{ usuario.nombre|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control bg-dark text-white border-secondary" 
                               value="{{ usuario.email|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Contraseña {% if action == 'editar' %}(dejar vacío para mantener){% endif %}
                        </label>
                        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" 
                               {% if action == 'crear' %}required{% endif %}>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select name="rol_id" class="form-select bg-dark text-white border-secondary" required>
                            <option value="">Seleccionar rol</option>
                            {% for rol in roles %}
                            <option value="{{ rol.id }}" {% if usuario.rol_id == rol.id %}selected{% endif %}>
                                {{ rol.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="activo" class="form-check-input" id="activo" 
                               {% if usuario.activo or action == 'crear' %}checked{% endif %}>
                        <label class="form-check-label" for="activo">Usuario activo</label>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-2"></i>Guardar
                        </button>
                        <a href="{% url 'usuario_list' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-2"></i>Volver
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
