{% extends 'base.html' %}

{% block title %}Eliminar Rol{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark border-danger">
            <div class="card-header bg-danger">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Eliminar Rol</h4>
            </div>
            <div class="card-body">
                <p class="lead">¿Estás seguro de eliminar el rol?</p>
                <h3 class="text-danger">{{ rol.nombre }}</h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-2"></i>Sí, Eliminar
                        </button>
                        <a href="{% url 'rol_list' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
