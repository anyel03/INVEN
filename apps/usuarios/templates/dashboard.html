{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">
        <i class="bi bi-speedometer2 me-2"></i>
        Dashboard
    </h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <span class="badge bg-primary align-self-center me-3">
            <i class="bi bi-person me-1"></i>
            {{ user }}
        </span>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-3 mb-3">
        <div class="card bg-primary text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 mb-0">Rutas Activas</h6>
                        <h2 class="mb-0">5</h2>
                    </div>
                    <i class="bi bi-geo-alt fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-3 mb-3">
        <div class="card bg-success text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 mb-0">Clientes</h6>
                        <h2 class="mb-0">124</h2>
                    </div>
                    <i class="bi bi-people fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-3 mb-3">
        <div class="card bg-warning text-dark">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-dark-50 mb-0">Ventas Hoy</h6>
                        <h2 class="mb-0">$8,500</h2>
                    </div>
                    <i class="bi bi-cart fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-3 mb-3">
        <div class="card bg-info text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 mb-0">Cobrar</h6>
                        <h2 class="mb-0">$12,000</h2>
                    </div>
                    <i class="bi bi-cash-stack fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <h5><i class="bi bi-lightning me-2"></i>Acciones Rápidas</h5>
        <div class="row mt-3">
            <div class="col-md-2">
                <a href="/ventas/nueva/" class="btn btn-outline-primary w-100 py-3">
                    <i class="bi bi-cart-plus d-block fs-2"></i>
                    Nueva Venta
                </a>
            </div>
            <div class="col-md-2">
                <a href="/clientes/nuevo/" class="btn btn-outline-success w-100 py-3">
                    <i class="bi bi-person-plus d-block fs-2"></i>
                    Nuevo Cliente
                </a>
            </div>
            <div class="col-md-2">
                <a href="/inventario/transferencia/" class="btn btn-outline-warning w-100 py-3">
                    <i class="bi bi-arrow-left-right d-block fs-2"></i>
                    Transferencia
                </a>
            </div>
            <div class="col-md-2">
                <a href="/cobros/nuevo/" class="btn btn-outline-info w-100 py-3">
                    <i class="bi bi-cash d-block fs-2"></i>
                    Registrar Cobro
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
