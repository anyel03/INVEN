{% extends 'base.html' %}

{% block title %}{{ action|title }} Producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark border-primary">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-box me-2"></i>{{ action|title }} Producto</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control bg-dark text-white border-secondary" 
                               value="{{ producto.nombre|default:'' }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Precio Compra</label>
                            <input type="number" step="0.01" name="precio_compra" class="form-control bg-dark text-white border-secondary" 
                                   value="{{ producto.precio_compra|default:'0' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Precio Venta</label>
                            <input type="number" step="0.01" name="precio_venta" class="form-control bg-dark text-white border-secondary" 
                                   value="{{ producto.precio_venta|default:'0' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stock Principal</label>
                        <input type="number" name="stock_principal" class="form-control bg-dark text-white border-secondary" 
                               value="{{ producto.stock_principal|default:'0' }}">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-2"></i>Guardar
                        </button>
                        <a href="{% url 'producto_list' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-2"></i>Volver
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
