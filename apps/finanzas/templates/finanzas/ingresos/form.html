{% extends 'base.html' %}

{% block title %}Nuevo Ingreso{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark border-success">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Nuevo Ingreso</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Descripción *</label>
                        <input type="text" name="descripcion" class="form-control bg-dark text-white border-secondary" required placeholder="Ej: Venta de reciclaje">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Monto *</label>
                        <input type="number" step="0.01" name="monto" class="form-control bg-dark text-white border-secondary" required min="0.01" placeholder="0.00">
                    </div>
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg me-2"></i>Guardar
                        </button>
                        <a href="{% url 'ingreso_list' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-2"></i>Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
