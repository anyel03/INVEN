{% extends 'base.html' %}

{% block title %}Ingresos{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom border-secondary">
    <h1><i class="bi bi-plus-circle me-2"></i>Ingresos</h1>
    <a href="{% url 'ingreso_create' %}" class="btn btn-success">
        <i class="bi bi-plus-lg me-2"></i>Nuevo Ingreso
    </a>
</div>

<div class="card bg-dark border-secondary">
    <div class="card-body p-0">
        <table class="table table-dark table-hover mb-0">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Fecha</th>
                    <th>Descripción</th>
                    <th>Monto</th>
                </tr>
            </thead>
            <tbody>
                {% for i in ingresos %}
                <tr>
                    <td>#{{ i.id }}</td>
                    <td>{{ i.fecha|date:"d/m/Y H:i" }}</td>
                    <td>{{ i.descripcion }}</td>
                    <td class="text-success">+${{ i.monto }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-center text-muted">No hay ingresos</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
