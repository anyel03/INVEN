{% extends 'base.html' %}

{% block title %}Nueva Compra{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-12">
        <div class="card bg-dark border-primary">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-cart-dash me-2"></i>Nueva Compra</h4>
            </div>
            <div class="card-body">
                <form method="post" id="compraForm">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label">Proveedor *</label>
                        <input type="text" name="proveedor" class="form-control bg-dark text-white border-secondary" required placeholder="Nombre del proveedor">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Productos</label>
                        <div class="table-responsive">
                            <table class="table table-dark table-bordered" id="productosTable">
                                <thead>
                                    <tr>
                                        <th>Producto</th>
                                        <th>Cantidad</th>
                                        <th>Precio Unitario</th>
                                        <th>Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="productosBody">
                                    <tr>
                                        <td>
                                            <select name="producto_id[]" class="form-select bg-dark text-white border-secondary">
                                                <option value="">Seleccionar...</option>
                                                {% for p in productos %}
                                                <option value="{{ p.id }}">{{ p.nombre }} (Stock: {{ p.stock_principal }})</option>
                                                {% endfor %}
                                            </select>
                                        </td>
                                        <td><input type="number" min="1" name="cantidad[]" class="form-control bg-dark text-white border-secondary" value="1"></td>
                                        <td><input type="number" step="0.01" name="precio[]" class="form-control bg-dark text-white border-secondary" value="0"></td>
                                        <td class="text-success">$<span class="subtotal">0.00</span></td>
                                        <td><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()"><i class="bi bi-trash"></i></button></td>
                                    </tr>
                                </tbody>
                            </table>
                            <button type="button" class="btn btn-outline-secondary" onclick="agregarProducto()">
                                <i class="bi bi-plus-lg me-2"></i>Agregar Producto
                            </button>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-12 text-end">
                            <h4 class="text-success">Total: $<span id="totalDisplay">0.00</span></h4>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-check-lg me-2"></i>Confirmar Compra
                        </button>
                        <a href="{% url 'finanzas_dashboard' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-2"></i>Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
function agregarProducto() {
    var row = document.querySelector('#productosBody tr').cloneNode(true);
    row.querySelectorAll('input').forEach(inp => inp.value = inp.name === 'cantidad[]' ? '1' : '');
    document.getElementById('productosBody').appendChild(row);
}
</script>
{% endblock %}
{% endblock %}
