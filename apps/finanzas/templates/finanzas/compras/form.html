{% extends 'base.html' %}

{% block title %}Registrar Nueva Compra{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card bg-dark border-primary shadow-lg">
            <div class="card-header bg-primary bg-opacity-10 border-primary py-3">
                <h4 class="mb-0 text-primary"><i class="bi bi-cart-plus me-2"></i>Registrar Compra a Proveedor</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" id="compraForm">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="proveedor" class="form-label fw-bold text-white fs-5">Proveedor *</label>
                        <input type="text" name="proveedor" id="proveedor" class="form-control bg-dark text-white border-secondary fs-5" required placeholder="Nombre o razón social del proveedor...">
                    </div>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label fw-bold text-white mb-0">Productos Comprados *</label>
                            <button type="button" class="btn btn-outline-success btn-sm" onclick="agregarProducto()">
                                <i class="bi bi-plus-lg me-1"></i>Agregar Fila de Producto
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-dark table-bordered align-middle mb-0" id="productosTable">
                                <thead class="table-secondary text-uppercase small">
                                    <tr>
                                        <th style="width: 40%;">Producto</th>
                                        <th style="width: 20%;">Cantidad</th>
                                        <th style="width: 20%;">Precio Unitario ($)</th>
                                        <th style="width: 15%;">Subtotal</th>
                                        <th style="width: 5%;" class="text-center"></th>
                                    </tr>
                                </thead>
                                <tbody id="productosBody">
                                    <tr class="producto-row">
                                        <td>
                                            <select name="producto_id[]" class="form-select bg-dark text-white border-secondary producto-select" required>
                                                <option value="">Seleccionar producto...</option>
                                                {% for p in productos %}
                                                <option value="{{ p.id }}" data-precio="{{ p.precio_compra }}">{{ p.nombre }} (Stock Principal: {{ p.stock_principal }})</option>
                                                {% endfor %}
                                            </select>
                                        </td>
                                        <td>
                                            <input type="number" min="1" name="cantidad[]" class="form-control bg-dark text-white border-secondary cantidad-input" value="1" required>
                                        </td>
                                        <td>
                                            <input type="number" step="0.01" min="0" name="precio[]" class="form-control bg-dark text-white border-secondary precio-input" value="0.00" required>
                                        </td>
                                        <td class="fw-bold text-success">$<span class="subtotal-span">0.00</span></td>
                                        <td class="text-center">
                                            <button type="button" class="btn btn-outline-danger btn-sm" onclick="eliminarFila(this)"><i class="bi bi-trash"></i></button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div class="card bg-secondary bg-opacity-20 border-secondary p-3 mb-4 text-end">
                        <span class="text-muted text-uppercase small fw-bold">Total Compra:</span>
                        <h2 class="text-success mb-0 fw-bold">$<span id="totalDisplay">0.00</span></h2>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'compra_list' %}" class="btn btn-outline-secondary px-4 me-md-2">
                            <i class="bi bi-arrow-left me-2"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary btn-lg px-5 shadow-sm">
                            <i class="bi bi-check-lg me-2"></i>Guardar Compra
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
function calcularTotales() {
    let grandTotal = 0;
    document.querySelectorAll('.producto-row').forEach(row => {
        const cant = parseFloat(row.querySelector('.cantidad-input').value) || 0;
        const prec = parseFloat(row.querySelector('.precio-input').value) || 0;
        const subtotal = cant * prec;
        row.querySelector('.subtotal-span').textContent = subtotal.toFixed(2);
        grandTotal += subtotal;
    });
    document.getElementById('totalDisplay').textContent = grandTotal.toFixed(2);
}

function attachRowEvents(row) {
    row.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', calcularTotales);
        inp.addEventListener('change', calcularTotales);
    });
    const select = row.querySelector('.producto-select');
    select.addEventListener('change', function() {
        const selectedOption = select.options[select.selectedIndex];
        const defaultPrecio = selectedOption ? parseFloat(selectedOption.getAttribute('data-precio')) : 0;
        if (defaultPrecio > 0 && parseFloat(row.querySelector('.precio-input').value) === 0) {
            row.querySelector('.precio-input').value = defaultPrecio.toFixed(2);
        }
        calcularTotales();
    });
}

function agregarProducto() {
    const tbody = document.getElementById('productosBody');
    const firstRow = tbody.querySelector('.producto-row');
    const newRow = firstRow.cloneNode(true);

    newRow.querySelector('.producto-select').value = '';
    newRow.querySelector('.cantidad-input').value = '1';
    newRow.querySelector('.precio-input').value = '0.00';
    newRow.querySelector('.subtotal-span').textContent = '0.00';

    tbody.appendChild(newRow);
    attachRowEvents(newRow);
    calcularTotales();
}

function eliminarFila(btn) {
    const tbody = document.getElementById('productosBody');
    if (tbody.querySelectorAll('.producto-row').length > 1) {
        btn.closest('tr').remove();
        calcularTotales();
    } else {
        alert('Debe haber al menos un producto en la compra.');
    }
}

// Inicializar eventos en la primera fila
document.querySelectorAll('.producto-row').forEach(attachRowEvents);
calcularTotales();
</script>
{% endblock %}
{% endblock %}
