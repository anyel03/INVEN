{% extends 'base.html' %}

{% block title %}Compras{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom border-secondary">
    <h1><i class="bi bi-cart-dash me-2"></i>Compras</h1>
    <a href="{% url 'compra_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-2"></i>Nueva Compra
    </a>
</div>

<div class="card bg-dark border-secondary">
    <div class="card-body p-0">
        <table class="table table-dark table-hover mb-0">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Fecha</th>
                    <th>Proveedor</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                {% for c in compras %}
                <tr>
                    <td>#{{ c.id }}</td>
                    <td>{{ c.fecha|date:"d/m/Y H:i" }}</td>
                    <td>{{ c.proveedor }}</td>
                    <td class="text-success">${{ c.total }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-center text-muted">No hay compras</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
