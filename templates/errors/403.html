{% extends 'base.html' %}

{% block title %}403 - Acceso Denegado{% endblock %}

{% block content %}
<div class="row justify-content-center pt-5 pb-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="card bg-dark border-danger shadow-lg p-4">
            <div class="card-body">
                <div class="mb-3">
                    <span class="badge bg-danger text-white font-monospace fs-6 px-3 py-2">ERROR 403</span>
                </div>
                <i class="bi bi-shield-lock-fill display-1 text-danger d-block mb-3 opacity-75"></i>
                <h2 class="text-white fw-bold mb-2">Acceso Denegado</h2>
                <p class="text-muted mb-4 fs-6">
                    No posees los privilegios o permisos de usuario necesarios (requiere rol de Administrador) para acceder a esta sección.
                </p>
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 me-sm-2">
                        <i class="bi bi-arrow-left me-1"></i>Regresar
                    </a>
                    <a href="{% url 'dashboard' %}" class="btn btn-primary fw-bold px-4 shadow-sm">
                        <i class="bi bi-speedometer2 me-1"></i>Ir al Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
